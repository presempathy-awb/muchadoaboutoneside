name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install exact lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_READ_TOKEN is required to read the private @telpher packages"
            exit 1
          fi
          umask 077
          trap 'rm -f "$HOME/.npmrc"' EXIT
          printf '%s\n' \
            '@telpher:registry=https://git.telpher.stream/api/packages/awb/npm/' \
            "//git.telpher.stream/api/packages/awb/npm/:_authToken=${NODE_AUTH_TOKEN}" \
            > "$HOME/.npmrc"
          bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run smoke
      - name: Test the rendered studio in isolated Chrome
        run: bun run test:browser --headless
