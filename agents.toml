schema = "agents.core.v1"
project = "muchadoaboutoneside"
generated = false

[project]
slug = "muchadoaboutoneside"
name = "Much Ado About One Side"
stack = "bun-react-elysia"
canonical_forge = "https://git.telpher.stream/awb/muchadoaboutoneside"
github_mirror = "https://github.com/presempathy-awb/muchadoaboutoneside"

